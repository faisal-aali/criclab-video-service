name: Start VM runner

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  start:
    name: Start EC2 runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.EC2_WORKER_INSTANCE_REGION }}

      - name: Start instance if stopped
        env:
          INSTANCE_ID: ${{ secrets.EC2_WORKER_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${INSTANCE_ID}" ]; then
            echo "EC2_WORKER_INSTANCE_ID secret is empty"
            exit 1
          fi
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "state=${STATE}"
          if [ "$STATE" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCE_ID"
            echo "start requested"
          else
            echo "skipped; not stopped"
          fi
