name: Start VM runner

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  start:
    name: Start EC2 runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.EC2_WORKER_INSTANCE_REGION }}

      - name: Start instance if stopped
        env:
          INSTANCE_ID: ${{ secrets.EC2_WORKER_INSTANCE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${INSTANCE_ID}" ]; then
            echo "EC2_WORKER_INSTANCE_ID secret is empty"
            exit 1
          fi
          STATE=$(aws ec2 describe-instances \
            --instance-ids "$INSTANCE_ID" \
            --query 'Reservations[0].Instances[0].State.Name' \
            --output text)
          echo "state=${STATE}"
          case "$STATE" in
            stopped)
              aws ec2 start-instances --instance-ids "$INSTANCE_ID"
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
              echo "started"
              ;;
            running)
              echo "already running"
              ;;
            stopping)
              aws ec2 wait instance-stopped --instance-ids "$INSTANCE_ID"
              aws ec2 start-instances --instance-ids "$INSTANCE_ID"
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
              echo "started after stopping"
              ;;
            pending)
              aws ec2 wait instance-running --instance-ids "$INSTANCE_ID"
              aws ec2 wait instance-status-ok --instance-ids "$INSTANCE_ID"
              echo "was pending; now running"
              ;;
            *)
              echo "cannot start from state ${STATE}"
              exit 1
              ;;
          esac
